name: Build Kernel GKI

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel source URL'
        required: true
        default: 'https://github.com/YFMARCO-Dev/android_kernel_samsung_sm6475.git'
      KERNEL_BRANCH:
        description: 'Kernel branch'
        required: true
        default: 'lineage-23.2'
      MODULES_SOURCE:
        description: 'Modules source URL'
        required: true
        default: 'https://github.com/YFMARCO-Dev/android_kernel_samsung_sm6475-modules.git'
      MODULES_BRANCH:
        description: 'Modules branch'
        required: true
        default: 'lineage-23.2'
      DEVICETREES_SOURCE:
        description: 'Device trees source URL'
        required: true
        default: 'https://github.com/YFMARCO-Dev/android_kernel_samsung_sm6475-devicetrees.git'
      DEVICETREES_BRANCH:
        description: 'Device trees branch'
        required: true
        default: 'lineage-23.2'
      KERNEL_NAME:
        description: 'Kernel/zip name'
        required: true
        default: 'Spider-Kernel'
      DEVICE_CODENAME:
        description: 'Device codename'
        required: true
        default: 'a36xq'
      CONFIG_FILE:
        description: 'Config file (You can put multiple configs separated by space)'
        required: true
        default: 'gki_defconfig vendor/parrot_perf.config oem/parrot_sec.config lego.config'
      TOOLCHAIN_URL:
        description: "Clone URL of your toolchain"
        required: true
        default: 'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-15.0.0_r1/clang-r522817.tar.gz'
      ANYKERNEL:
        description: "Clone URL of your AnyKernel"
        required: true
        default: 'https://github.com/YFMARCO-Dev/AnyKernel3.git'
      ANYKERNEL_BRANCH:
        description: "AnyKernel branch"
        required: true
        default: 'master'

jobs:
  Build:
    name: ${{ github.event.inputs.KERNEL_NAME }} by ${{ github.actor }}
    runs-on: ubuntu-22.04
    permissions: write-all
    defaults:
      run:
       shell: bash
       working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set-up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev
          sudo apt-get install -y curl git ftp lftp wget libarchive-tools ccache python-is-python3
          sudo apt-get install -y zip unzip tar gzip bzip2 rar unrar cpio jq python3-pip device-tree-compiler
          
      - name: Cloning Kernel Source
        run: |
          urlenc() {
            printf %s "$1" | python -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.stdin.read().strip(), safe=""))'
          }

          clone_repo() {
            git clone --single-branch --depth=1 --no-tags "https://$(urlenc "${{ secrets.KERNEL_USERNAME }}"):$(urlenc "${{ secrets.KERNEL_TOKEN }}")@$(echo "$1" | sed 's~https://~~')" -b "$2" "$3"
          }

          clone_repo "${{ github.event.inputs.KERNEL_SOURCE }}" "${{ github.event.inputs.KERNEL_BRANCH }}" "${{ github.workspace }}/kernel"

          cd ${{ github.workspace }}/kernel
          git submodule update --init --recursive

          MODULES_DIR_NAME=$(grep -E '^ext-mod-dir[[:space:]]*:=' Makefile | head -n1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]+$//' | xargs -r basename || true)
          if [[ -z "${MODULES_DIR_NAME}" ]]; then
            MODULES_DIR_NAME=$(basename "${{ github.event.inputs.MODULES_SOURCE }}" .git | sed -E 's/.*_([^_]+-modules)$/\1/')
          fi

          DEVICETREES_DIR_NAME=$(grep -rhoE '\.\./[A-Za-z0-9_]+-devicetrees' --include=Makefile --include=Kbuild --include='*.mk' --include='*.bzl' --include='*.bp' . 2>/dev/null | head -n1 | sed 's~\.\./~~' || true)
          if [[ -z "${DEVICETREES_DIR_NAME}" ]]; then
            DEVICETREES_DIR_NAME=$(basename "${{ github.event.inputs.DEVICETREES_SOURCE }}" .git | sed -E 's/.*_([^_]+-devicetrees)$/\1/')
          fi

          DTS_LINK_TARGET=$(readlink arch/arm64/boot/dts/vendor 2>/dev/null || cat arch/arm64/boot/dts/vendor 2>/dev/null || true)
          DTS_LINK_NAME=$(basename "${DTS_LINK_TARGET}" 2>/dev/null || true)
          if [[ "${DTS_LINK_NAME}" == *-devicetrees ]]; then
            DEVICETREES_DIR_NAME="${DTS_LINK_NAME}"
          fi

          echo "MODULES_DIR=${{ github.workspace }}/${MODULES_DIR_NAME}" >> $GITHUB_ENV
          echo "DEVICETREES_DIR=${{ github.workspace }}/${DEVICETREES_DIR_NAME}" >> $GITHUB_ENV

          clone_repo "${{ github.event.inputs.MODULES_SOURCE }}" "${{ github.event.inputs.MODULES_BRANCH }}" "${{ github.workspace }}/${MODULES_DIR_NAME}"
          clone_repo "${{ github.event.inputs.DEVICETREES_SOURCE }}" "${{ github.event.inputs.DEVICETREES_BRANCH }}" "${{ github.workspace }}/${DEVICETREES_DIR_NAME}"

          EXPECTED_MOD_DIR=$(grep -E '^ext-mod-dir[[:space:]]*:=' Makefile | head -n1 | sed -E 's/^[^=]*=[[:space:]]*//' | sed -E 's/[[:space:]]+$//' | sed -E 's|^\.\./||')
          if [[ -n "${EXPECTED_MOD_DIR}" && "${EXPECTED_MOD_DIR}" != "${MODULES_DIR_NAME}" ]]; then
            sed -i -E "s|^ext-mod-dir[[:space:]]*:=.*|ext-mod-dir := ../${MODULES_DIR_NAME}|" Makefile
          fi
          if grep -q "qcom/opensource/video-kernel" Makefile; then
            if [[ ! -d "${{ github.workspace }}/${MODULES_DIR_NAME}/qcom/opensource/video-kernel" && -d "${{ github.workspace }}/${MODULES_DIR_NAME}/qcom/opensource/video-driver" ]]; then
              sed -i "s|qcom/opensource/video-kernel|qcom/opensource/video-driver|g" Makefile
            fi
          fi
          if [[ ! -d arch/arm64/boot/dts/vendor ]]; then
            rm -f arch/arm64/boot/dts/vendor
            ln -s "../../../../../${DEVICETREES_DIR_NAME}" arch/arm64/boot/dts/vendor
          fi

          AUDIO_KBUILD="${{ github.workspace }}/${MODULES_DIR_NAME}/qcom/opensource/audio-kernel/asoc/Kbuild"
          if [[ -f "${AUDIO_KBUILD}" ]] && ! grep -q "machine_defect_detector" "${AUDIO_KBUILD}" && [[ -f "$(dirname "${AUDIO_KBUILD}")/machine_defect_detector.c" ]]; then
            sed -i 's~^\(\tMACHINE_OBJS += waipio\.o\)$~\1\n\tMACHINE_OBJS += machine_defect_detector.o~' "${AUDIO_KBUILD}"
            echo "PATCHED ${AUDIO_KBUILD}: added machine_defect_detector.o"
          fi

          DEFECT_C="$(dirname "${AUDIO_KBUILD}")/machine_defect_detector.c"
          if [[ -f "${DEFECT_C}" ]] && grep -q "^static void send_abc_event(void)$" "${DEFECT_C}" && ! grep -q "__maybe_unused send_abc_event" "${DEFECT_C}"; then
            sed -i 's~^static void send_abc_event(void)$~static void __maybe_unused send_abc_event(void)~' "${DEFECT_C}"
            echo "PATCHED ${DEFECT_C}: marked send_abc_event maybe_unused"
          fi

          HF_HDR=""
          SYNX_HDR=""
          for v in "${{ github.workspace }}/${MODULES_DIR_NAME}"/*/opensource; do
            if [[ -f "${v}/mm-drivers/hw_fence/include/msm_hw_fence_synx_translation.h" ]]; then
              HF_HDR="${v}/mm-drivers/hw_fence/include/msm_hw_fence_synx_translation.h"
            fi
            if [[ -f "${v}/synx-kernel/msm/synx/synx_api.h" ]]; then
              SYNX_HDR="${v}/synx-kernel/msm/synx/synx_api.h"
            fi
          done
          echo "HF_HDR=${HF_HDR}"
          echo "SYNX_HDR=${SYNX_HDR}"
          if [[ -n "${HF_HDR}" && -n "${SYNX_HDR}" ]]; then
            if grep -q "enum synx_hwfence_client_id" "${HF_HDR}" && grep -q "SYNX_CLIENT_HW_FENCE_GFX_CTX0" "${SYNX_HDR}"; then
              sed -i '/^enum synx_hwfence_client_id {/,/^};/d' "${HF_HDR}"
              echo "PATCHED ${HF_HDR}: removed duplicate synx client enum"
            else
              echo "HF patch skipped: duplicate enum pattern not found"
            fi
          else
            echo "HF patch skipped: headers not found"
          fi
          
      - name: Set-up Toolchain
        run: |
         mkdir -p ${{ github.workspace }}/toolchain
         if [[ "${{ github.event.inputs.TOOLCHAIN_URL }}" == *.tar.gz ]]; then
             wget -O clang-toolchain.tar.gz "${{ github.event.inputs.TOOLCHAIN_URL }}"
             tar -xzf clang-toolchain.tar.gz -C ${{ github.workspace }}/toolchain
             rm -f clang-toolchain.tar.gz
         else
             git clone --single-branch --depth=1 --no-tags ${{ github.event.inputs.TOOLCHAIN_URL }} ${{ github.workspace }}/toolchain
         fi

      - name: Set environment variables
        run: |
          echo "OBJDIR=${{ github.workspace }}/out" >> $GITHUB_ENV
          echo "TARGET_PRODUCT=${{ github.event.inputs.DEVICE_CODENAME }}" >> $GITHUB_ENV
          echo "ANYKERNEL=${{ github.workspace }}/anykernel" >> $GITHUB_ENV
          echo "CLANG_DIR=${{ github.workspace }}/toolchain" >> $GITHUB_ENV
          echo "KERNEL_NAME=${{ github.event.inputs.KERNEL_NAME }}" >> $GITHUB_ENV
          echo "ZIP_NAME=${{ github.event.inputs.KERNEL_NAME }}_${{ github.event.inputs.DEVICE_CODENAME }}_$(date +"%d%m%Y").zip" >> $GITHUB_ENV
          echo "OUTPUT_DIR=${{ github.workspace }}/compiled" >> $GITHUB_ENV
          cd ${{ github.workspace }}/kernel && echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

          KERNEL_SOURCE_URL="${{ github.event.inputs.KERNEL_SOURCE }}"
          if [[ "${KERNEL_SOURCE_URL}" == *.git ]]; then
            KERNEL_SOURCE_URL="${KERNEL_SOURCE_URL%.git}"
          fi
          echo "KERNEL_SOURCE_URL=${KERNEL_SOURCE_URL}" >> $GITHUB_ENV
         
      - name: Start Compilation
        run: |
         mkdir -p ${{ env.OUTPUT_DIR }}
         cd ${{ github.workspace }}/kernel
         
         export PATH="${{ env.CLANG_DIR }}/bin:$PATH"

         start=$(date +"%s")

         MAKE_ARGS=(
            O=${{ env.OBJDIR }}
            ARCH=arm64
            CC=clang
            KCFLAGS="-Wno-frame-larger-than -Wno-error=implicit-int -Wno-error=incompatible-function-pointer-types -Wno-error=misleading-indentation"
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            AR=llvm-ar
            LLVM_NM=llvm-nm
            OBJCOPY=llvm-objcopy
            LD=ld.lld
            NM=llvm-nm
            LLVM=1
            LLVM_IAS=1
         )
         
         make_defconfig() {
            make -s ARCH=arm64 O=${{ env.OBJDIR }} ${{ github.event.inputs.CONFIG_FILE }} -j$(nproc --all)
         }
         
         compile() {
            make -j$(nproc --all) "${MAKE_ARGS[@]}" Image Image.gz dtbs modules
         }

         get_ext_mod_dirs() {
            awk '/^ext-mod-dirs[[:space:]]*:=[[:space:]]*\\[[:space:]]*$/{f=1;next} f{print; if ($0 !~ /\\[[:space:]]*$/) f=0}' Makefile \
            | sed -E 's/\\//g; s/\$\(ext-mod-dir\)\/?//; s/^[[:space:]]+//; s/[[:space:]]+$//' \
            | { grep -v '^$' || true; }
         }

         compile_ext_modules() {
            extra_symbols=""
            units=()
            WRAPPER_ARGS=()
            for a in "${MAKE_ARGS[@]}"; do
               if [[ "${a}" == O=* ]]; then
                  continue
               fi
               WRAPPER_ARGS+=("${a}")
            done
            export KBUILD_EXTRA_SYMBOLS=""
            for w in "${{ env.MODULES_DIR }}"/*/opensource/wlan/platform; do
               if [[ -d "${w}" ]]; then
                  export WLAN_PLATFORM_ROOT="${w}"
               fi
            done
            while IFS= read -r mod_rel; do
               mod_path="$(resolve_mod_dir "${mod_rel}" || true)"
               if [[ -z "${mod_path}" ]]; then
                  echo "SKIPPING ${mod_rel}: directory not found"
                  continue
               fi
               dup=0
               for u in "${units[@]}"; do
                  if [[ "${mod_path}" == "${u}" ]]; then
                     dup=1
                     break
                  fi
               done
               if [[ "${dup}" == "0" ]]; then
                  units+=("${mod_path}")
               fi
            done < <(get_ext_mod_dirs)

            while IFS= read -r top; do
               dup=0
               for u in "${units[@]}"; do
                  if [[ "${top}" == "${u}" ]]; then
                     dup=1
                     break
                  fi
               done
               if [[ "${dup}" == "0" ]]; then
                  units+=("${top}")
               fi
            done < <(for d in "${{ env.MODULES_DIR }}"/*/opensource/* "${{ env.MODULES_DIR }}"/*; do
               if [[ -d "${d}" ]]; then
                  if [[ -f "${d}/Makefile" && -f "${d}/Kbuild" ]]; then
                     echo "${d}"
                  fi
               fi
            done)

            while IFS= read -r kb; do
               sub="$(dirname "${kb}")"
               if [[ ! -f "${sub}/Makefile" ]]; then
                  continue
               fi
               parent="$(dirname "${sub}")"
               if [[ -f "${parent}/Kbuild" || -f "${parent}/Makefile" ]]; then
                  continue
               fi
               dup=0
               for u in "${units[@]}"; do
                  if [[ "${sub}" == "${u}" ]]; then
                     dup=1
                     break
                  fi
               done
               if [[ "${dup}" == "0" ]]; then
                  units+=("${sub}")
               fi
            done < <(find "${{ env.MODULES_DIR }}" -mindepth 4 -maxdepth 6 -name Kbuild | sort -u)

            filtered=()
            for u in "${units[@]}"; do
               base="$(basename "${u}")"
               if [[ "${base}" == "emac-dwc-eqos" ]]; then
                  if ! header_exists "linux/msm-bus.h"; then
                     echo "SKIPPING ${u}: prerequisite linux/msm-bus.h not present in trees"
                     continue
                  fi
               fi
               if [[ "${base}" == "ubwcp" ]]; then
                  if ! header_exists "linux/qcom_scm.h"; then
                     echo "SKIPPING ${u}: prerequisite linux/qcom_scm.h not present in trees"
                     continue
                  fi
               fi
               if [[ "${base}" == "qcacld-3.0" ]]; then
                  soc="$(echo "${{ github.event.inputs.CONFIG_FILE }}" | grep -oE "(vendor|oem)/[A-Za-z0-9_]+" | head -n1 | sed -E 's~^(vendor|oem)/~~; s/_.*//' || true)"
                  chips=()
                  if [[ -n "${soc}" ]]; then
                     for f in "${u}/configs/${soc}_gki_"*_defconfig; do
                        if [[ -f "${f}" ]]; then
                           chip="$(basename "${f}" _defconfig | sed -E "s~^${soc}_gki_~~")"
                           chips+=("${chip}")
                        fi
                     done
                  fi
                  nchip=0
                  for c in "${chips[@]}"; do
                     nchip=$((nchip + 1))
                  done
                  if [[ "${nchip}" == "1" ]]; then
                     lnk="$(dirname "${u}")/${chips}"
                     ln -sfn "${u}" "${lnk}"
                     echo "WLAN PROFILE ${chips} VIA ${lnk}"
                     filtered+=("${lnk}")
                     continue
                  fi
                  echo "SKIPPING ${u}: ambiguous WLAN_PROFILE ${chips[*]}"
                  continue
               fi
               filtered+=("${u}")
            done
            units=("${filtered[@]}")

            pending=("${units[@]}")
            pass=0
            while [[ -n "${pending[*]}" && "${pass}" -lt 4 ]]; do
               pass=$((pass + 1))
               failed=()
               for mod_path in "${pending[@]}"; do
                  echo "BUILDING EXTERNAL MODULE ${mod_path}"
                  if build_mod "${mod_path}" "${extra_symbols}"; then
                     if [[ -f "${mod_path}/Module.symvers" ]]; then
                        extra_symbols="${extra_symbols} ${mod_path}/Module.symvers"
                     fi
                  else
                     failed+=("${mod_path}")
                  fi
               done
               pending=("${failed[@]}")
            done
            if [[ -n "${pending[*]}" ]]; then
               echo "FAILED EXTERNAL MODULES ${pending[*]}"
               return 1
            fi

            find "${{ env.MODULES_DIR }}" "${{ env.OBJDIR }}" -name "*.ko" -exec llvm-strip --strip-debug {} \;
         }

         resolve_mod_dir() {
            rel="$1"
            cand="${{ env.MODULES_DIR }}/${rel}"
            if [[ "${rel}" == *video-kernel && ! -d "${cand}" ]]; then
               cand="${{ env.MODULES_DIR }}/${rel/video-kernel/video-driver}"
            fi
            if [[ -d "${cand}" ]]; then
               if [[ -f "${cand}/Makefile" || -f "${cand}/Kbuild" ]]; then
                  printf %s "${cand}"
                  return 0
               fi
               if [[ "${cand}" == *video-kernel ]]; then
                  alt="${cand/video-kernel/video-driver}"
                  if [[ -f "${alt}/Makefile" || -f "${alt}/Kbuild" ]]; then
                     printf %s "${alt}"
                     return 0
                  fi
               fi
               parent="$(dirname "${cand}")"
               if [[ -f "${parent}/Makefile" || -f "${parent}/Kbuild" ]]; then
                  printf %s "${parent}"
                  return 0
               fi
            fi
            return 1
         }

         build_mod() {
            mod_rel="$(realpath -s --relative-to=${{ github.workspace }}/kernel "$1")"
            if grep -q "KERNEL_SRC" "$1/Makefile" 2>/dev/null; then
               fchain=""
               for s in $2; do
                  dup=0
                  for r in $(grep -o '\$(M)/[^[:space:]]*Module\.symvers' "$1/Makefile" 2>/dev/null || true); do
                     rel="$(echo "${r}" | sed 's~^\$(M)/~~')"
                     if [[ "$(realpath -m "$1/${rel}")" == "$(realpath -m "${s}")" ]]; then
                        dup=1
                        break
                     fi
                  done
                  if [[ "${dup}" == "0" ]]; then
                     fchain="${fchain} ${s}"
                  fi
               done
               export KBUILD_EXTRA_SYMBOLS="${fchain}"
               make -j$(nproc --all) -C "$1" "${WRAPPER_ARGS[@]}" KERNEL_SRC=${{ github.workspace }}/kernel M="${mod_rel}" KBUILD_OUTPUT=${{ env.OBJDIR }} all
            else
               make -j$(nproc --all) -C ${{ github.workspace }}/kernel "${MAKE_ARGS[@]}" \
                  M="${mod_rel}" \
                  KBUILD_EXTRA_SYMBOLS="$2" \
                  AUDIO_ROOT="$1" \
                  TOUCH_ROOT="$1" \
                  DISPLAY_ROOT="$1" \
                  VIDEO_ROOT="$1" \
                  SSG_MODULE_ROOT="$1" \
                  CAMERA_KERNEL_ROOT="$1" \
                  KERNEL_ROOT="$1" \
                  WLAN_ROOT="$1" \
                  SYNX_ROOT="$1" \
                  MSM_HW_FENCE_ROOT="$1" \
                  SYNC_FENCE_ROOT="$1" \
                  SPU_ROOT="$1" \
                  MMRM_ROOT="$1" \
                  DSP_ROOT="$1" \
                  MSM_EXT_DISPLAY_ROOT="$1" \
                  BT_ROOT="$1" \
                  modules
            fi
         }

         header_exists() {
            find "${{ github.workspace }}/kernel" "${{ env.MODULES_DIR }}" -path "*$1" 2>/dev/null | grep -q .
         }

         make_defconfig
         compile
         compile_ext_modules

         end=$(date +"%s")
         diff=$((end - start))
         echo -e "BUILD COMPLETED IN ${diff} SECONDS"

        continue-on-error: false
         
      - name: Checking for outputs and packaging
        run: |
         cd "${{ env.OBJDIR }}"
         
         compiled_image="arch/arm64/boot/Image"
         compiled_gz_image="arch/arm64/boot/Image.gz"
         compiled_gz_dtb="arch/arm64/boot/Image.gz-dtb"
           
         if [[ -f ${compiled_image} || -f ${compiled_gz_image} || -f ${compiled_gz_dtb} ]]; then
              git clone -q -b ${{ github.event.inputs.ANYKERNEL_BRANCH }} ${{ github.event.inputs.ANYKERNEL }} "${{ env.ANYKERNEL }}"

              if [[ -f "${compiled_image}" ]]; then
                  cp -f "${compiled_image}" "${{ env.ANYKERNEL }}/Image" || true
                  cp -f "${compiled_image}" "${{ env.OUTPUT_DIR }}/Image" || true
              elif [[ -f "${compiled_gz_image}" ]]; then
                  cp -f "${compiled_gz_image}" "${{ env.ANYKERNEL }}/Image.gz" || true
                  cp -f "${compiled_gz_image}" "${{ env.OUTPUT_DIR }}/Image.gz" || true
              elif [[ -f "${compiled_gz_dtb}" ]]; then
                  cp -f "${compiled_gz_dtb}" "${{ env.ANYKERNEL }}/Image.gz-dtb" || true
                  cp -f "${compiled_gz_dtb}" "${{ env.OUTPUT_DIR }}/Image.gz-dtb" || true
              fi
              
              if ls arch/arm64/boot/dts/vendor/qcom/*.dtbo 1> /dev/null 2>&1; then
                  python ${{ github.workspace }}/scripts/mkdtboimg.py create arch/arm64/boot/dtbo.img --page_size=4096 arch/arm64/boot/dts/vendor/qcom/*.dtbo
              elif ls arch/arm64/boot/*.dtbo 1> /dev/null 2>&1; then
                  python ${{ github.workspace }}/scripts/mkdtboimg.py create arch/arm64/boot/dtbo.img --page_size=4096 arch/arm64/boot/*.dtbo
              fi

              if [[ -f "arch/arm64/boot/dtbo.img" ]]; then
                  cp -f "arch/arm64/boot/dtbo.img" "${{ env.ANYKERNEL }}/dtbo.img" || true
                  cp -f "arch/arm64/boot/dtbo.img" "${{ env.OUTPUT_DIR }}/dtbo.img" || true
              fi

              if [[ -f "arch/arm64/boot/dtb.img" ]]; then
                  cp -f "arch/arm64/boot/dtb.img" "${{ env.ANYKERNEL }}/dtb.img" || true
                  cp -f "arch/arm64/boot/dtb.img" "${{ env.OUTPUT_DIR }}/dtb.img" || true
              elif [[ -f "arch/arm64/boot/dtb" ]]; then
                  cp -f "arch/arm64/boot/dtb" "${{ env.ANYKERNEL }}/dtb.img" || true
                  cp -f "arch/arm64/boot/dtb" "${{ env.OUTPUT_DIR }}/dtb.img" || true
              else
                  dtb_dir=""
                  if ls arch/arm64/boot/dts/vendor/qcom/*.dtb 1> /dev/null 2>&1; then
                      dtb_dir="arch/arm64/boot/dts/vendor/qcom"
                  elif ls arch/arm64/boot/dts/*.dtb 1> /dev/null 2>&1; then
                      dtb_dir="arch/arm64/boot/dts"
                  fi

                  if [[ -n "${dtb_dir}" ]]; then
                      find "${dtb_dir}" -maxdepth 1 -name "*.dtb" ! -name "*dtbo*" ! -name "*overlay*" -exec cat {} + > arch/arm64/boot/dtb.img
                      if [[ -s "arch/arm64/boot/dtb.img" ]]; then
                          cp -f "arch/arm64/boot/dtb.img" "${{ env.ANYKERNEL }}/dtb.img" || true
                          cp -f "arch/arm64/boot/dtb.img" "${{ env.OUTPUT_DIR }}/dtb.img" || true
                      fi
                  fi
              fi

              mkdir -p "${{ env.ANYKERNEL }}/modules/system/lib/modules"
              
              find "${{ env.OBJDIR }}" "${{ env.MODULES_DIR }}" -name "*.ko" -exec cp -f {} "${{ env.ANYKERNEL }}/modules/system/lib/modules/" \;

              cd "${{ env.ANYKERNEL }}"
              zip -r AnyKernel.zip *
              mv -- "AnyKernel.zip" "${{ env.ZIP_NAME }}"
              mv -- "${{ env.ANYKERNEL }}/${{ env.ZIP_NAME }}" "${{ env.OUTPUT_DIR }}/${{ env.ZIP_NAME }}"
              rm -rf "${{ env.ANYKERNEL }}"
         else
              echo "ERROR: Some output is missing!"
              exit 1
         fi
         
         zip_file=$(find ${{ env.OUTPUT_DIR }} -name '${{ github.event.inputs.KERNEL_NAME }}*.zip' -print -quit)
         echo "ZIP_NAME=$(basename "$zip_file" .zip)" >> $GITHUB_ENV
         echo "RELEASE_DATE=$(date +'%B %-d, %Y %H:%M')" >> $GITHUB_ENV

      - name: Upload files to repository releases page
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ github.workspace }}/compiled/*
          name: ${{ github.event.inputs.KERNEL_NAME }} // ${{ env.RELEASE_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            [Kernel Source](${{ env.KERNEL_SOURCE_URL }}/tree/${{ github.event.inputs.KERNEL_BRANCH }})
            [Latest Commit](${{ env.KERNEL_SOURCE_URL }}/commit/${{ env.COMMIT_ID }}) at the time of building.
