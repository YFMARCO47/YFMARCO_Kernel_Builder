name: Build Kernel GKI

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel source URL'
        required: true
        default: 'https://github.com/YFMARCO-Dev/android_kernel_samsung_sm6475.git'
      KERNEL_BRANCH:
        description: 'Kernel branch'
        required: true
        default: 'lineage-23.2'
      MODULES_SOURCE:
        description: 'Modules source URL'
        required: true
        default: 'https://github.com/YFMARCO-Dev/android_kernel_samsung_sm6475-modules.git'
      MODULES_BRANCH:
        description: 'Modules branch'
        required: true
        default: 'lineage-23.2'
      DEVICETREES_SOURCE:
        description: 'Device trees source URL'
        required: true
        default: 'https://github.com/YFMARCO-Dev/android_kernel_samsung_sm6475-devicetrees.git'
      DEVICETREES_BRANCH:
        description: 'Device trees branch'
        required: true
        default: 'lineage-23.2'
      KERNEL_NAME:
        description: 'Kernel/zip name'
        required: true
        default: 'Spider-Kernel'
      DEVICE_CODENAME:
        description: 'Device codename'
        required: true
        default: 'a36xq'
      CONFIG_FILE:
        description: 'Config file (You can put multiple configs separated by space)'
        required: true
        default: 'gki_defconfig vendor/parrot_perf.config oem/parrot_sec.config lego.config'
      TOOLCHAIN_URL:
        description: "Clone URL of your toolchain"
        required: true
        default: 'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-15.0.0_r1/clang-r522817.tar.gz'
      ANYKERNEL:
        description: "Clone URL of your AnyKernel"
        required: true
        default: 'https://github.com/YFMARCO-Dev/AnyKernel3.git'
      ANYKERNEL_BRANCH:
        description: "AnyKernel branch"
        required: true
        default: 'master'

jobs:
  Build:
    name: ${{ github.event.inputs.KERNEL_NAME }} by ${{ github.actor }}
    runs-on: ubuntu-22.04
    permissions: write-all
    defaults:
      run:
       shell: bash
       working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set-up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev
          sudo apt-get install -y curl git ftp lftp wget libarchive-tools ccache python-is-python3
          sudo apt-get install -y zip unzip tar gzip bzip2 rar unrar cpio jq python3-pip device-tree-compiler
          
      - name: Cloning Kernel Source
        run: |
          urlenc() {
            printf %s "$1" | python -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.stdin.read().strip(), safe=""))'
          }

          clone_repo() {
            git clone --single-branch --depth=1 --no-tags "https://$(urlenc "${{ secrets.KERNEL_USERNAME }}"):$(urlenc "${{ secrets.KERNEL_TOKEN }}")@$(echo "$1" | sed 's~https://~~')" -b "$2" "$3"
          }

          clone_repo "${{ github.event.inputs.KERNEL_SOURCE }}" "${{ github.event.inputs.KERNEL_BRANCH }}" "${{ github.workspace }}/kernel"

          cd ${{ github.workspace }}/kernel
          git submodule update --init --recursive

          MODULES_DIR_NAME=$(grep -E '^ext-mod-dir[[:space:]]*:=' Makefile | head -n1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]+$//' | xargs -r basename || true)
          if [[ -z "${MODULES_DIR_NAME}" ]]; then
            MODULES_DIR_NAME=$(basename "${{ github.event.inputs.MODULES_SOURCE }}" .git | sed -E 's/.*_([^_]+-modules)$/\1/')
          fi

          DEVICETREES_DIR_NAME=$(grep -rhoE '\.\./[A-Za-z0-9_]+-devicetrees' --include=Makefile --include=Kbuild --include='*.mk' --include='*.bzl' --include='*.bp' . 2>/dev/null | head -n1 | sed 's~\.\./~~' || true)
          if [[ -z "${DEVICETREES_DIR_NAME}" ]]; then
            DEVICETREES_DIR_NAME=$(basename "${{ github.event.inputs.DEVICETREES_SOURCE }}" .git | sed -E 's/.*_([^_]+-devicetrees)$/\1/')
          fi

          echo "MODULES_DIR=${{ github.workspace }}/${MODULES_DIR_NAME}" >> $GITHUB_ENV
          echo "DEVICETREES_DIR=${{ github.workspace }}/${DEVICETREES_DIR_NAME}" >> $GITHUB_ENV
          echo "EXT_OUT_DIR=${{ github.workspace }}/kernel/${MODULES_DIR_NAME}" >> $GITHUB_ENV

          clone_repo "${{ github.event.inputs.MODULES_SOURCE }}" "${{ github.event.inputs.MODULES_BRANCH }}" "${{ github.workspace }}/${MODULES_DIR_NAME}"
          clone_repo "${{ github.event.inputs.DEVICETREES_SOURCE }}" "${{ github.event.inputs.DEVICETREES_BRANCH }}" "${{ github.workspace }}/${DEVICETREES_DIR_NAME}"
          
      - name: Set-up Toolchain
        run: |
         mkdir -p ${{ github.workspace }}/toolchain
         if [[ "${{ github.event.inputs.TOOLCHAIN_URL }}" == *.tar.gz ]]; then
             wget -O clang-toolchain.tar.gz "${{ github.event.inputs.TOOLCHAIN_URL }}"
             tar -xzf clang-toolchain.tar.gz -C ${{ github.workspace }}/toolchain
             rm -f clang-toolchain.tar.gz
         else
             git clone --single-branch --depth=1 --no-tags ${{ github.event.inputs.TOOLCHAIN_URL }} ${{ github.workspace }}/toolchain
         fi

      - name: Set environment variables
        run: |
          echo "OBJDIR=${{ github.workspace }}/kernel/out" >> $GITHUB_ENV
          echo "ANYKERNEL=${{ github.workspace }}/anykernel" >> $GITHUB_ENV
          echo "CLANG_DIR=${{ github.workspace }}/toolchain" >> $GITHUB_ENV
          echo "KERNEL_NAME=${{ github.event.inputs.KERNEL_NAME }}" >> $GITHUB_ENV
          echo "ZIP_NAME=${{ github.event.inputs.KERNEL_NAME }}_${{ github.event.inputs.DEVICE_CODENAME }}_$(date +"%d%m%Y").zip" >> $GITHUB_ENV
          echo "OUTPUT_DIR=${{ github.workspace }}/compiled" >> $GITHUB_ENV
          cd ${{ github.workspace }}/kernel && echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

          KERNEL_SOURCE_URL="${{ github.event.inputs.KERNEL_SOURCE }}"
          if [[ "${KERNEL_SOURCE_URL}" == *.git ]]; then
            KERNEL_SOURCE_URL="${KERNEL_SOURCE_URL%.git}"
          fi
          echo "KERNEL_SOURCE_URL=${KERNEL_SOURCE_URL}" >> $GITHUB_ENV
         
      - name: Start Compilation
        run: |
         mkdir -p ${{ env.OUTPUT_DIR }}
         cd ${{ github.workspace }}/kernel

         export PATH="${{ env.CLANG_DIR }}/bin:$PATH"

         start=$(date +"%s")

         KERNEL_DIR="${{ github.workspace }}/kernel"
         MODULES_DIR_NAME=$(basename "${MODULES_DIR}")
         SHIM_DIR="${{ github.workspace }}/shim"
         mkdir -p "${EXT_OUT_DIR}" "${SHIM_DIR}/inc/linux" "${SHIM_DIR}/vendor"

         for mod_top in "${MODULES_DIR}"/*/; do
            ln -sfn "${mod_top%/}" "${SHIM_DIR}/vendor/$(basename "${mod_top}")"
         done

         SHIM_FLAGS="-I${SHIM_DIR}/inc"
         shim_path="${SHIM_DIR}"
         for depth_level in 1 2 3 4 5 6 7 8; do
            shim_path="${shim_path}/l"
            mkdir -p "${shim_path}"
            if (( depth_level >= 2 )); then
               SHIM_FLAGS="${SHIM_FLAGS} -I${shim_path}"
            fi
         done

         qcom_scm_h=$(find "${KERNEL_DIR}/include" -name qcom_scm.h 2>/dev/null | head -n1 || true)
         if [[ ! -e "${KERNEL_DIR}/include/linux/qcom_scm.h" && -n "${qcom_scm_h}" ]]; then
            ln -sf "${qcom_scm_h}" "${SHIM_DIR}/inc/linux/qcom_scm.h"
         fi

         MAKE_ARGS=(
            O=${{ env.OBJDIR }}
            ARCH=arm64
            CC=clang
            KCFLAGS="-Wno-frame-larger-than -Wno-error=implicit-int -Wno-error=incompatible-function-pointer-types -Wno-misleading-indentation -Wno-format ${SHIM_FLAGS}"
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            AR=llvm-ar
            LLVM_NM=llvm-nm
            OBJCOPY=llvm-objcopy
            LD=ld.lld
            NM=llvm-nm
            LLVM=1
            LLVM_IAS=1
         )

         make_defconfig() {
            make -s ARCH=arm64 O=${{ env.OBJDIR }} ${{ github.event.inputs.CONFIG_FILE }} -j$(nproc --all)
         }

         compile() {
            make -j$(nproc --all) "${MAKE_ARGS[@]}" Image Image.gz dtbs modules
         }

         get_ext_mod_dirs() {
            awk '/^ext-mod-dirs[[:space:]]*:=[[:space:]]*\\[[:space:]]*$/{f=1;next} f{print; if ($0 !~ /\\[[:space:]]*$/) f=0}' Makefile \
            | sed -E 's/\\//g; s/\$\(ext-mod-dir\)\/?//; s/^[[:space:]]+//; s/[[:space:]]+$//' \
            | { grep -v '^$' || true; }
         }

         discover_kbuild_dirs() {
            find "${MODULES_DIR}" -name Kbuild -not -path '*/.git/*' -printf '%h\n' | sort \
            | awk 'BEGIN{p=""} { if (p=="" || index($0, p "/") != 1) { print; p=$0 } }' \
            | sed "s~^${MODULES_DIR}/~~"
         }

         declare -A BUILT_MODS
         declare -a FAILED_MODS
         extra_symbols=""
         mapfile -t TOP_DIRS < <(discover_kbuild_dirs)

         collect_symvers() {
            local rel="$1"
            local symvers
            for symvers in "${EXT_OUT_DIR}/${rel}/Module.symvers" "${MODULES_DIR}/${rel}/Module.symvers" "${OBJDIR}/${rel}/Module.symvers"; do
               if [[ -f "${symvers}" ]]; then
                  extra_symbols="${extra_symbols} $(realpath "${symvers}")"
                  break
               fi
            done
         }

         top_dir_for_file() {
            local f="$1"
            local d dir
            for d in "${TOP_DIRS[@]}"; do
               if [[ "${f}" == "${MODULES_DIR}/${d}/"* ]]; then
                  echo "${d}"
                  return 0
               fi
            done
            dir=$(dirname "${f}")
            while [[ "${dir}" != "${MODULES_DIR}" && "${dir}" != "/" ]]; do
               if [[ -f "${dir}/Makefile" ]] && grep -qE 'obj-(m|\$)' "${dir}/Makefile"; then
                  echo "${dir#${MODULES_DIR}/}"
                  return 0
               fi
               dir=$(dirname "${dir}")
            done
            return 0
         }

         find_providers() {
            local sym="$1"
            local rel="$2"
            local files f d
            files=$(grep -rlE "EXPORT_SYMBOL[A-Z_]*\([[:space:]]*${sym}[[:space:]]*\)" "${MODULES_DIR}" --include='*.c' 2>/dev/null || true)
            if [[ -z "${files}" ]]; then
               files=$(grep -rlw -- "${sym}" "${MODULES_DIR}" --include='*.c' --include='*.h' 2>/dev/null || true)
            fi
            for f in ${files}; do
               d=$(top_dir_for_file "${f}")
               if [[ -n "${d}" && "${d}" != "${rel}" ]]; then
                  echo "${d}"
               fi
            done | sort -u
            return 0
         }

         build_ext_module() {
            local rel="$1"
            local log="$2"
            local warn_mode="${3:-0}"
            local rc=0
            local mod_path="${MODULES_DIR}/${rel}"
            local m_rel="../${MODULES_DIR_NAME}/${rel}"
            local warn_args=()
            if [[ "${warn_mode}" == "1" ]]; then
               warn_args=(KBUILD_MODPOST_WARN=1)
            fi
            if [[ -f "${mod_path}/Makefile" ]] && grep -q 'KERNEL_SRC' "${mod_path}/Makefile"; then
               make -j$(nproc --all) -C "${mod_path}" "${MAKE_ARGS[@]}" \
                  KERNEL_SRC="${KERNEL_DIR}" \
                  M="${m_rel}" \
                  KBUILD_EXTRA_SYMBOLS="${extra_symbols}" \
                  "${warn_args[@]}" 2>&1 | tee "${log}" || rc=${PIPESTATUS[0]}
            else
               make -j$(nproc --all) -C "${KERNEL_DIR}" "${MAKE_ARGS[@]}" \
                  M="${m_rel}" \
                  KBUILD_EXTRA_SYMBOLS="${extra_symbols}" \
                  "${warn_args[@]}" \
                  modules 2>&1 | tee "${log}" || rc=${PIPESTATUS[0]}
            fi
            return ${rc}
         }

         find_kernel_definition() {
            local sym="$1"
            local dirs=()
            local d
            for d in sound drivers techpack include; do
               if [[ -d "${KERNEL_DIR}/${d}" ]]; then
                  dirs+=("${KERNEL_DIR}/${d}")
               fi
            done
            if (( ${#dirs[@]} == 0 )); then
               return 0
            fi
            grep -rlE "EXPORT_SYMBOL[A-Z_]*\([[:space:]]*${sym}[[:space:]]*\)" "${dirs[@]}" --include='*.c' 2>/dev/null | head -n1 || true
            return 0
         }

         describe_empty_module() {
            local rel="$1"
            local kb="${MODULES_DIR}/${rel}/Kbuild"
            echo "::warning::${rel} finished but produced no .ko files"
            if [[ -f "${kb}" ]]; then
               echo "ARCH CONFIGS REFERENCED BY ${rel}/Kbuild: $(grep -hoE 'CONFIG_ARCH_[A-Z0-9_]+' "${kb}" | sort -u | tr '\n' ' ' || true)"
            fi
            echo "ARCH CONFIGS ENABLED IN .config: $(grep -E '^CONFIG_ARCH_[A-Z0-9_]+=y' "${OBJDIR}/.config" | sed 's/=y//' | tr '\n' ' ' || true)"
            return 0
         }

         resolve_mod_dir() {
            local rel="$1"
            local cur parent base stem cand
            if [[ -d "${MODULES_DIR}/${rel}" ]]; then
               cur="${rel}"
            else
               parent=$(dirname "${rel}")
               base=$(basename "${rel}")
               stem=$(echo "${base}" | sed -E 's/-(kernel|drivers|driver)$//')
               cand=$(find "${MODULES_DIR}/${parent}" -mindepth 1 -maxdepth 1 -type d -name "${stem}*" 2>/dev/null | sort | head -n1 || true)
               if [[ -z "${cand}" ]]; then
                  return 0
               fi
               cur="${cand#${MODULES_DIR}/}"
            fi
            while [[ ! -f "${MODULES_DIR}/${cur}/Kbuild" && ! -f "${MODULES_DIR}/${cur}/Makefile" ]]; do
               if [[ "${cur}" != */* ]]; then
                  return 0
               fi
               cur=$(dirname "${cur}")
            done
            echo "${cur}"
            return 0
         }

         ensure_ext_module() {
            local rel="$1"
            local depth="$2"
            local log syms sym provider providers added attempt missing sv sv_abs sv_rel sv_dir kdef
            local warn_mode=0
            if [[ -n "${BUILT_MODS[$rel]:-}" ]]; then
               return 0
            fi
            if (( depth > 6 )); then
               return 1
            fi
            BUILT_MODS[$rel]="pending"
            for attempt in 1 2 3 4; do
               log=$(mktemp)
               echo "BUILDING EXTERNAL MODULE ${rel}"
               if build_ext_module "${rel}" "${log}" "${warn_mode}"; then
                  BUILT_MODS[$rel]="done"
                  collect_symvers "${rel}"
                  if (( warn_mode == 1 )); then
                     echo "::warning::${rel} was built with unresolved symbols: ${syms}"
                  fi
                  if [[ -z "$(find "${EXT_OUT_DIR}/${rel}" -name '*.ko' -print -quit 2>/dev/null || true)" ]]; then
                     describe_empty_module "${rel}"
                  fi
                  return 0
               fi
               added=0
               missing=$(grep -oE '[^ ]+/Module\.symvers: No such file or directory' "${log}" | sed -E 's/: No such file or directory$//' | sort -u || true)
               for sv in ${missing}; do
                  if [[ "${sv}" == /* ]]; then
                     sv_abs=$(realpath -m "${sv}")
                  else
                     sv_abs=$(realpath -m "${OBJDIR}/${sv}")
                  fi
                  if [[ "${sv_abs}" == "${EXT_OUT_DIR}/"* ]]; then
                     sv_rel=$(dirname "${sv_abs#${EXT_OUT_DIR}/}")
                     sv_dir=$(resolve_mod_dir "${sv_rel}")
                     echo "MISSING SYMVERS FROM ${sv_rel} RESOLVED TO ${sv_dir:-not found}"
                     if [[ -n "${sv_dir}" && "${sv_dir}" != "${rel}" && -z "${BUILT_MODS[$sv_dir]:-}" ]]; then
                        if ensure_ext_module "${sv_dir}" $((depth + 1)); then
                           added=1
                        fi
                     fi
                  fi
               done
               syms=$(grep -oE 'ERROR: modpost: "[^"]+"' "${log}" | sed -E 's/.*"([^"]+)"/\1/' | sort -u || true)
               for sym in ${syms}; do
                  providers=$(find_providers "${sym}" "${rel}")
                  echo "UNDEFINED SYMBOL ${sym} PROVIDERS: ${providers:-not found}"
                  if [[ -z "${providers}" ]]; then
                     kdef=$(find_kernel_definition "${sym}")
                     echo "KERNEL SOURCE EXPORTING ${sym}: ${kdef:-not found}"
                  fi
                  for provider in ${providers}; do
                     if [[ -z "${BUILT_MODS[$provider]:-}" ]]; then
                        if ensure_ext_module "${provider}" $((depth + 1)); then
                           added=1
                        fi
                     fi
                  done
               done
               if (( added == 0 )) && (( warn_mode == 0 )) && [[ -n "${syms}" ]]; then
                  warn_mode=1
                  echo "RETRYING ${rel} WITH KBUILD_MODPOST_WARN=1"
                  continue
               fi
               if (( added == 0 )); then
                  break
               fi
            done
            unset 'BUILT_MODS[$rel]'
            return 1
         }

         module_enabled_by_config() {
            local rel="$1"
            local dir="${MODULES_DIR}/${rel}"
            local tokens token f
            tokens=$(for f in "${dir}/Kbuild" "${dir}/Makefile"; do
               if [[ -f "${f}" ]]; then
                  grep -hoE 'CONFIG_ARCH_[A-Z0-9_]+' "${f}" || true
               fi
            done | sort -u)
            if [[ -z "${tokens}" ]]; then
               return 0
            fi
            for token in ${tokens}; do
               if grep -qE "^${token}=(y|m)$" "${OBJDIR}/.config"; then
                  return 0
               fi
            done
            echo "SKIPPING ${rel}: none of $(echo ${tokens}) is enabled in .config"
            return 1
         }

         find_wrapper_dir() {
            local rel="$1"
            local cur="${rel}"
            while true; do
               if [[ -f "${MODULES_DIR}/${cur}/Makefile" ]] && grep -q 'KERNEL_SRC' "${MODULES_DIR}/${cur}/Makefile"; then
                  echo "${cur}"
                  return 0
               fi
               if [[ "${cur}" != */* ]]; then
                  break
               fi
               cur=$(dirname "${cur}")
            done
            echo "${rel}"
            return 0
         }

         is_covered() {
            local c="$1"
            local k
            for k in "${!BUILT_MODS[@]}" "${FAILED_MODS[@]}"; do
               if [[ "${c}" == "${k}" || "${c}" == "${k}/"* || "${k}" == "${c}/"* ]]; then
                  return 0
               fi
            done
            return 1
         }

         compile_ext_modules() {
            local mod_rel mod_resolved cand
            local -a queue=()
            while IFS= read -r mod_rel; do
               mod_resolved=$(resolve_mod_dir "${mod_rel}")
               if [[ -z "${mod_resolved}" ]]; then
                  echo "SKIPPING ${mod_rel}: no matching module directory"
                  continue
               fi
               if [[ "${mod_resolved}" != "${mod_rel}" ]]; then
                  echo "RESOLVED ${mod_rel} -> ${mod_resolved}"
               fi
               queue+=("${mod_resolved}")
            done < <(get_ext_mod_dirs)

            for cand in "${TOP_DIRS[@]}"; do
               queue+=("$(find_wrapper_dir "${cand}")")
            done

            echo "MODULE BUILD QUEUE: ${queue[*]}"

            for mod_resolved in "${queue[@]}"; do
               if is_covered "${mod_resolved}"; then
                  continue
               fi
               if ! module_enabled_by_config "${mod_resolved}"; then
                  continue
               fi
               if ! ensure_ext_module "${mod_resolved}" 0; then
                  FAILED_MODS+=("${mod_resolved}")
                  echo "::warning::failed to build external module ${mod_resolved}"
               fi
            done

            find "${EXT_OUT_DIR}" "${OBJDIR}" -name "*.ko" -exec llvm-strip --strip-debug {} \;

            echo "EXTERNAL MODULES BUILT: ${!BUILT_MODS[*]}"
            echo "EXTERNAL .ko FILES: $(find "${EXT_OUT_DIR}" -name '*.ko' | wc -l)"
            if (( ${#FAILED_MODS[@]} > 0 )); then
               echo "FAILED EXTERNAL MODULES: ${FAILED_MODS[*]}"
            fi
         }

         make_defconfig
         compile
         compile_ext_modules

         end=$(date +"%s")
         diff=$((end - start))
         echo -e "BUILD COMPLETED IN ${diff} SECONDS"

        continue-on-error: false
         
      - name: Checking for outputs and packaging
        run: |
         cd "${{ env.OBJDIR }}"
         
         compiled_image="arch/arm64/boot/Image"
         compiled_gz_image="arch/arm64/boot/Image.gz"
         compiled_gz_dtb="arch/arm64/boot/Image.gz-dtb"
           
         if [[ -f ${compiled_image} || -f ${compiled_gz_image} || -f ${compiled_gz_dtb} ]]; then
              git clone -q -b ${{ github.event.inputs.ANYKERNEL_BRANCH }} ${{ github.event.inputs.ANYKERNEL }} "${{ env.ANYKERNEL }}"

              if [[ -f "${compiled_image}" ]]; then
                  cp -f "${compiled_image}" "${{ env.ANYKERNEL }}/Image" || true
                  cp -f "${compiled_image}" "${{ env.OUTPUT_DIR }}/Image" || true
              elif [[ -f "${compiled_gz_image}" ]]; then
                  cp -f "${compiled_gz_image}" "${{ env.ANYKERNEL }}/Image.gz" || true
                  cp -f "${compiled_gz_image}" "${{ env.OUTPUT_DIR }}/Image.gz" || true
              elif [[ -f "${compiled_gz_dtb}" ]]; then
                  cp -f "${compiled_gz_dtb}" "${{ env.ANYKERNEL }}/Image.gz-dtb" || true
                  cp -f "${compiled_gz_dtb}" "${{ env.OUTPUT_DIR }}/Image.gz-dtb" || true
              fi
              
              if ls arch/arm64/boot/dts/vendor/qcom/*.dtbo 1> /dev/null 2>&1; then
                  python ${{ github.workspace }}/scripts/mkdtboimg.py create arch/arm64/boot/dtbo.img --page_size=4096 arch/arm64/boot/dts/vendor/qcom/*.dtbo
              elif ls arch/arm64/boot/*.dtbo 1> /dev/null 2>&1; then
                  python ${{ github.workspace }}/scripts/mkdtboimg.py create arch/arm64/boot/dtbo.img --page_size=4096 arch/arm64/boot/*.dtbo
              fi

              if [[ -f "arch/arm64/boot/dtbo.img" ]]; then
                  cp -f "arch/arm64/boot/dtbo.img" "${{ env.ANYKERNEL }}/dtbo.img" || true
                  cp -f "arch/arm64/boot/dtbo.img" "${{ env.OUTPUT_DIR }}/dtbo.img" || true
              fi

              if [[ -f "arch/arm64/boot/dtb.img" ]]; then
                  cp -f "arch/arm64/boot/dtb.img" "${{ env.ANYKERNEL }}/dtb.img" || true
                  cp -f "arch/arm64/boot/dtb.img" "${{ env.OUTPUT_DIR }}/dtb.img" || true
              elif [[ -f "arch/arm64/boot/dtb" ]]; then
                  cp -f "arch/arm64/boot/dtb" "${{ env.ANYKERNEL }}/dtb.img" || true
                  cp -f "arch/arm64/boot/dtb" "${{ env.OUTPUT_DIR }}/dtb.img" || true
              else
                  dtb_dir=""
                  if ls arch/arm64/boot/dts/vendor/qcom/*.dtb 1> /dev/null 2>&1; then
                      dtb_dir="arch/arm64/boot/dts/vendor/qcom"
                  elif ls arch/arm64/boot/dts/*.dtb 1> /dev/null 2>&1; then
                      dtb_dir="arch/arm64/boot/dts"
                  fi

                  if [[ -n "${dtb_dir}" ]]; then
                      find "${dtb_dir}" -maxdepth 1 -name "*.dtb" ! -name "*dtbo*" ! -name "*overlay*" -exec cat {} + > arch/arm64/boot/dtb.img
                      if [[ -s "arch/arm64/boot/dtb.img" ]]; then
                          cp -f "arch/arm64/boot/dtb.img" "${{ env.ANYKERNEL }}/dtb.img" || true
                          cp -f "arch/arm64/boot/dtb.img" "${{ env.OUTPUT_DIR }}/dtb.img" || true
                      fi
                  fi
              fi

              mkdir -p "${{ env.ANYKERNEL }}/modules/system/lib/modules"
              
              mkdir -p "${{ env.EXT_OUT_DIR }}"
              find "${{ env.OBJDIR }}" "${{ env.EXT_OUT_DIR }}" "${{ env.MODULES_DIR }}" -name "*.ko" -exec cp -f {} "${{ env.ANYKERNEL }}/modules/system/lib/modules/" \;

              cd "${{ env.ANYKERNEL }}"
              zip -r AnyKernel.zip *
              mv -- "AnyKernel.zip" "${{ env.ZIP_NAME }}"
              mv -- "${{ env.ANYKERNEL }}/${{ env.ZIP_NAME }}" "${{ env.OUTPUT_DIR }}/${{ env.ZIP_NAME }}"
              rm -rf "${{ env.ANYKERNEL }}"
         else
              echo "ERROR: Some output is missing!"
              exit 1
         fi
         
         zip_file=$(find ${{ env.OUTPUT_DIR }} -name '${{ github.event.inputs.KERNEL_NAME }}*.zip' -print -quit)
         echo "ZIP_NAME=$(basename "$zip_file" .zip)" >> $GITHUB_ENV
         echo "RELEASE_DATE=$(date +'%B %-d, %Y %H:%M')" >> $GITHUB_ENV

      - name: Upload files to repository releases page
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ github.workspace }}/compiled/*
          name: ${{ github.event.inputs.KERNEL_NAME }} // ${{ env.RELEASE_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            [Kernel Source](${{ env.KERNEL_SOURCE_URL }}/tree/${{ github.event.inputs.KERNEL_BRANCH }})
            [Latest Commit](${{ env.KERNEL_SOURCE_URL }}/commit/${{ env.COMMIT_ID }}) at the time of building.
