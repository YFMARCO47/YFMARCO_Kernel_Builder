name: Build Kernel Kleaf (Bazel)

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel source URL'
        required: true
        default: 'https://github.com/YFMARCO-Dev/android_kernel_samsung_sm6475.git'
      KERNEL_BRANCH:
        description: 'Kernel branch'
        required: true
        default: 'lineage-23.2'
      MODULES_SOURCE:
        description: 'Modules source URL'
        required: true
        default: 'https://github.com/YFMARCO-Dev/android_kernel_samsung_sm6475-modules.git'
      MODULES_BRANCH:
        description: 'Modules branch'
        required: true
        default: 'lineage-23.2'
      DEVICETREES_SOURCE:
        description: 'Device trees source URL'
        required: true
        default: 'https://github.com/YFMARCO-Dev/android_kernel_samsung_sm6475-devicetrees.git'
      DEVICETREES_BRANCH:
        description: 'Device trees branch'
        required: true
        default: 'lineage-23.2'
      KERNEL_NAME:
        description: 'Kernel/zip name'
        required: true
        default: 'Spider-Kernel'
      DEVICE_CODENAME:
        description: 'Device codename'
        required: true
        default: 'a36xq'
      CONFIG_FILE:
        description: 'Config file (You can put multiple configs separated by space)'
        required: true
        default: 'gki_defconfig vendor/parrot_perf.config oem/parrot_sec.config lego.config'
      TOOLCHAIN_URL:
        description: "Clone URL of your toolchain"
        required: true
        default: 'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-15.0.0_r1/clang-r522817.tar.gz'
      ANYKERNEL:
        description: "Clone URL of your AnyKernel"
        required: true
        default: 'https://github.com/YFMARCO-Dev/AnyKernel3.git'
      ANYKERNEL_BRANCH:
        description: "AnyKernel branch"
        required: true
        default: 'master'

jobs:
  Build:
    name: ${{ github.event.inputs.KERNEL_NAME }} (Kleaf) by ${{ github.actor }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      # Fixed settings (edit here, not in the dispatch form)
      KERNEL_DEST: msm-kernel
      MODULES_DEST: kernel/samsung/sm6475-modules
      BAZEL_TARGET: //msm-kernel:parrot_perf_dist
      BAZEL_ARGS: --verbose_failures

      # Paths (everything heavy lives on /mnt)
      ROOT: /mnt/kleaf
      WS: /mnt/kleaf/kernel/platform/kernel-6.6
      DIST_DIR: /mnt/kleaf/dist
      BAZEL_ROOT: /mnt/bazel_root
      CLANG_DIR: /mnt/toolchain
      OUTPUT_DIR: ${{ github.workspace }}/compiled

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space and prepare dirs
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo mkdir -p "$ROOT" "$BAZEL_ROOT" "$DIST_DIR" "$CLANG_DIR"
          sudo chown -R "$USER":"$USER" "$ROOT" "$BAZEL_ROOT" "$CLANG_DIR"
          mkdir -p "$OUTPUT_DIR"
          df -h / /mnt

      - name: Set-up environment
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bc rsync git curl wget python3 python3-pip \
                                  zip unzip xz-utils cpio jq libssl-dev device-tree-compiler xxd
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.email "ci@github.actions"
          git config --global user.name  "github-actions"
          git config --global color.ui false

      - name: Sync Kleaf tree (repo + manifest)
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:$PATH"

          SRC_XML="$RUNNER_TEMP/kernel-platform.src.xml"
          cat > "$SRC_XML" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="kernel/platform/kernel-6.6/build/kernel" name="kernel/build" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66">
              <linkfile src="kleaf/bazel.sh" dest="kernel/platform/kernel-6.6/tools/bazel" />
              <linkfile src="kleaf/bazel.WORKSPACE" dest="kernel/platform/kernel-6.6/WORKSPACE" />
              <linkfile src="kleaf/bzlmod/bazel.MODULE.bazel" dest="kernel/platform/kernel-6.6/MODULE.bazel" />
              <linkfile src="kleaf/bzlmod/bazel.WORKSPACE.bzlmod" dest="kernel/platform/kernel-6.6/WORKSPACE.bzlmod" />
            </project>
            <project path="kernel/platform/kernel-6.6/build/bazel_common_rules" name="platform/build/bazel_common_rules" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/common" name="kernel/common" revision="android15-6.6-2026-07" upstream="android15-6.6-2026-07" dest-branch="android15-6.6-2026-07" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/kernel/configs" name="kernel/configs" revision="main" upstream="main" dest-branch="main" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/common-modules/wonder" name="kernel/common-modules/wonder" revision="144825c631d444dc7219c7affaea3e717b27df4c" upstream="android15-6.6" dest-branch="android15-6.6" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/common-modules/trusty" name="kernel/common-modules/trusty" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/common-modules/virtio-media" name="platform/external/virtio-media" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/common-modules/virtual-device" name="kernel/common-modules/virtual-device" revision="211d96f861e1d6061ecb6bbe6e289ce8bf144290" upstream="android15-6.6" dest-branch="android15-6.6" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/prebuilts/clang/host/linux-x86" name="platform/prebuilts/clang/host/linux-x86" revision="main-kernel-build-2024" remote="aosp" clone-depth="1" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8" name="platform/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8" revision="main-kernel-build-2024" remote="aosp" clone-depth="1" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/prebuilts/build-tools" name="platform/prebuilts/build-tools" revision="main-kernel-build-2024" remote="aosp" clone-depth="1" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/prebuilts/clang-tools" name="platform/prebuilts/clang-tools" revision="main-kernel-build-2024" remote="aosp" clone-depth="1" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/prebuilts/kernel-build-tools" name="kernel/prebuilts/build-tools" revision="main-kernel-build-2024" remote="aosp" clone-depth="1" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/prebuilts/rust" name="platform/prebuilts/rust" revision="main-kernel-build-2024" remote="aosp" clone-depth="1" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/tools/mkbootimg" name="platform/system/tools/mkbootimg" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/prebuilts/jdk/jdk11" name="platform/prebuilts/jdk/jdk11" revision="main-kernel-build-2024" remote="aosp" clone-depth="1" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/prebuilts/ndk-r26" name="toolchain/prebuilts/ndk/r26" revision="main-kernel-build-2024" remote="aosp" clone-depth="1" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/external/libcap-ng" name="platform/external/libcap-ng" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/external/libcap" name="platform/external/libcap" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/external/bazel-skylib" name="platform/external/bazel-skylib" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/external/bazelbuild-bazel-central-registry" name="platform/external/bazelbuild-bazel-central-registry" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/external/bazelbuild-platforms" name="platform/external/bazelbuild-platforms" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/external/bazelbuild-apple_support" name="platform/external/bazelbuild-apple_support" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/external/bazelbuild-rules_cc" name="platform/external/bazelbuild-rules_cc" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/external/bazelbuild-rules_java" name="platform/external/bazelbuild-rules_java" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/external/bazelbuild-rules_license" name="platform/external/bazelbuild-rules_license" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/external/bazelbuild-rules_pkg" name="platform/external/bazelbuild-rules_pkg" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/external/bazelbuild-rules_python" name="platform/external/bazelbuild-rules_python" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/external/python/absl-py" name="platform/external/python/absl-py" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/external/lz4" name="platform/external/lz4" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/external/pigz" name="platform/external/pigz" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/external/toybox" name="platform/external/toybox" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/external/zlib" name="platform/external/zlib" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
            <project path="kernel/platform/kernel-6.6/external/zopfli" name="platform/external/zopfli" revision="main-kernel-build-2024" remote="aosp" groups="kernel-platform,kernel-platform-66" />
          </manifest>
          XML

          # Wrap the project list in a minimal top-level manifest (adds remote/default if missing)
          MAN="$RUNNER_TEMP/manifest_repo"
          rm -rf "$MAN" && mkdir -p "$MAN"
          cp "$SRC_XML" "$MAN/kernel-platform.xml"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<manifest>'
            if ! grep -q '<remote ' "$SRC_XML"; then
              echo '  <remote name="aosp" fetch="https://android.googlesource.com/" />'
              echo '  <default revision="main" remote="aosp" sync-j="4" />'
            fi
            echo '  <include name="kernel-platform.xml" />'
            echo '</manifest>'
          } > "$MAN/default.xml"
          git -C "$MAN" init -q -b main
          git -C "$MAN" add -A
          git -C "$MAN" commit -q -m "local manifest"

          cd "$ROOT"
          repo init -u "file://$MAN" -b main -m default.xml --depth=1 --no-repo-verify -q
          repo sync -c -j6 --no-tags --no-clone-bundle --optimized-fetch --force-sync --retry-fetches=3 -q

          [ -e "$WS/tools/bazel" ] || { echo "::error::tools/bazel missing"; ls -la "$WS"; exit 1; }

      - name: Cloning Kernel, Modules and Device trees
        env:
          KERNEL_USERNAME: ${{ secrets.KERNEL_USERNAME }}
          KERNEL_TOKEN: ${{ secrets.KERNEL_TOKEN }}
          KERNEL_SOURCE: ${{ github.event.inputs.KERNEL_SOURCE }}
          KERNEL_BRANCH: ${{ github.event.inputs.KERNEL_BRANCH }}
          MODULES_SOURCE: ${{ github.event.inputs.MODULES_SOURCE }}
          MODULES_BRANCH: ${{ github.event.inputs.MODULES_BRANCH }}
          DEVICETREES_SOURCE: ${{ github.event.inputs.DEVICETREES_SOURCE }}
          DEVICETREES_BRANCH: ${{ github.event.inputs.DEVICETREES_BRANCH }}
        run: |
          set -euo pipefail

          urlq() { python3 -c 'import sys,urllib.parse as p;print(p.quote(sys.argv[1].strip(),safe=""))' "$1"; }
          U=$(urlq "$KERNEL_USERNAME"); T=$(urlq "$KERNEL_TOKEN")
          clone() {
            git clone --single-branch --depth=1 --no-tags -b "$2" "https://${U}:${T}@${1#https://}" "$3"
          }

          KDIR="$WS/$KERNEL_DEST"
          MDIR="$ROOT/$MODULES_DEST"
          rm -rf "$KDIR" "$MDIR"
          mkdir -p "$(dirname "$KDIR")" "$(dirname "$MDIR")"

          clone "$KERNEL_SOURCE" "$KERNEL_BRANCH" "$KDIR"
          git -C "$KDIR" submodule update --init --recursive

          clone "$MODULES_SOURCE" "$MODULES_BRANCH" "$MDIR"

          # Alias symlinks for the directory names referenced by the modules (../../../../NAME/qcom/opensource)
          NAMES=$(grep -rhoE '\.\./\.\./\.\./\.\./[A-Za-z0-9_.-]+/qcom/opensource' --include='*.h' --include='*.c' "$MDIR" 2>/dev/null \
                  | sed -E 's#^(\.\./){4}##; s#/qcom/opensource$##' | sort -u || true)
          for N in $NAMES; do
            if [ "$N" != "$(basename "$MDIR")" ]; then
              ln -sfn "$(basename "$MDIR")" "$(dirname "$MDIR")/$N"
            fi
          done

          # Device trees: resolve the dts symlink inside the kernel and clone to its target
          DTS_LINK=$(find "$KDIR/arch/arm64/boot/dts" -maxdepth 1 -type l -print -quit 2>/dev/null || true)
          if [ -n "$DTS_LINK" ]; then
            DT_DIR=$(readlink -m "$DTS_LINK")
          else
            DT_DIR="$(dirname "$KDIR")/$(basename "$DEVICETREES_SOURCE" .git)"
            echo "::warning::No dts symlink found in kernel, cloning devicetrees to $DT_DIR"
          fi
          if [ -d "$DT_DIR" ] && [ -n "$(ls -A "$DT_DIR" 2>/dev/null)" ]; then
            echo "Device tree dir already populated: $DT_DIR (skip)"
          else
            mkdir -p "$(dirname "$DT_DIR")"
            clone "$DEVICETREES_SOURCE" "$DEVICETREES_BRANCH" "$DT_DIR"
          fi

          {
            echo "COMMIT_ID=$(git -C "$KDIR" rev-parse HEAD)"
            echo "KERNEL_SOURCE_URL=${KERNEL_SOURCE%.git}"
          } >> "$GITHUB_ENV"

      - name: Fix missing Bazel BUILD packages
        run: |
          set -euo pipefail
          echo "Scanning for directories with .bzl files missing a BUILD file..."
          find "$WS" -type f -name "*.bzl" 2>/dev/null | while read -r bzl_file; do
            dir=$(dirname "$bzl_file")
            if [ ! -f "$dir/BUILD" ] && [ ! -f "$dir/BUILD.bazel" ]; then
              echo "::info::Creating empty BUILD file in $dir"
              touch "$dir/BUILD"
            fi
          done || true

      - name: Set-up Toolchain
        env:
          TOOLCHAIN_URL: ${{ github.event.inputs.TOOLCHAIN_URL }}
        run: |
          set -euo pipefail
          rm -rf "$CLANG_DIR" && mkdir -p "$CLANG_DIR"
          if [[ "$TOOLCHAIN_URL" == *.tar.gz ]]; then
            wget -q -O clang-toolchain.tar.gz "$TOOLCHAIN_URL"
            tar -xzf clang-toolchain.tar.gz -C "$CLANG_DIR"
            rm -f clang-toolchain.tar.gz
          else
            git clone --single-branch --depth=1 --no-tags "$TOOLCHAIN_URL" "$CLANG_DIR"
          fi
          [ -x "$CLANG_DIR/bin/clang" ] || { echo "::error::$CLANG_DIR/bin/clang not found"; ls -la "$CLANG_DIR"; exit 1; }
          "$CLANG_DIR/bin/clang" --version | head -n 1

      - name: Pre-flight check (Bazel target)
        run: |
          set -euo pipefail
          PKG="${BAZEL_TARGET#//}"; PKG="${PKG%%:*}"
          if [ ! -f "$WS/$PKG/BUILD.bazel" ] && [ ! -f "$WS/$PKG/BUILD" ]; then
            echo "::error::No BUILD.bazel in '$PKG'. The kernel tree must define the dist target."
            find "$WS" -maxdepth 2 -name 'BUILD.bazel' | head -50
            exit 1
          fi

      - name: Start Compilation (Kleaf / Bazel)
        env:
          CONFIG_FILE: ${{ github.event.inputs.CONFIG_FILE }}
        run: |
          set -euo pipefail
          cd "$WS"
          start=$(date +%s)

          KDIR="$WS/$KERNEL_DEST"
          PKG="${BAZEL_TARGET#//}"; PKG="${PKG%%:*}"
          BUILD_FILE="$WS/$PKG/BUILD.bazel"; [ -f "$BUILD_FILE" ] || BUILD_FILE="$WS/$PKG/BUILD"

          # CONFIG_FILE: first entry is the base defconfig (defined by the Bazel target),
          # the remaining entries are merged into one extra defconfig fragment.
          FRAG="$WS/$PKG/ci_defconfig_fragment"
          : > "$FRAG"
          set -- $CONFIG_FILE
          shift || true
          for c in "$@"; do
            f="$KDIR/arch/arm64/configs/$c"
            if [ -f "$f" ]; then
              cat "$f" >> "$FRAG"; echo >> "$FRAG"
            else
              echo "::warning::config fragment not found: $c"
            fi
          done
          if ! grep -q 'ci_defconfig_fragment' "$BUILD_FILE"; then
            echo 'exports_files(["ci_defconfig_fragment"], visibility = ["//visibility:public"])' >> "$BUILD_FILE"
          fi

          # shellcheck disable=SC2086
          tools/bazel --output_user_root="$BAZEL_ROOT" run \
            --user_clang_toolchain="$CLANG_DIR" \
            --sandbox_add_mount_pair="$CLANG_DIR" \
            --defconfig_fragment="//${PKG}:ci_defconfig_fragment" \
            $BAZEL_ARGS \
            "$BAZEL_TARGET" -- --destdir="$DIST_DIR"

          echo "BUILD COMPLETED IN $(( $(date +%s) - start )) SECONDS"
          ls -lh "$DIST_DIR" | head -100

      - name: Checking for outputs and packaging
        env:
          ANYKERNEL_URL: ${{ github.event.inputs.ANYKERNEL }}
          ANYKERNEL_BRANCH: ${{ github.event.inputs.ANYKERNEL_BRANCH }}
          KERNEL_NAME: ${{ github.event.inputs.KERNEL_NAME }}
          DEVICE_CODENAME: ${{ github.event.inputs.DEVICE_CODENAME }}
        run: |
          set -euo pipefail
          AK="$RUNNER_TEMP/anykernel"
          ZIP_NAME="${KERNEL_NAME}_${DEVICE_CODENAME}_$(date +%d%m%Y).zip"

          IMG=""
          for n in Image Image.gz Image.gz-dtb; do
            f=$(find "$DIST_DIR" -maxdepth 3 -name "$n" -type f -print -quit)
            if [ -n "$f" ]; then IMG="$f"; break; fi
          done
          if [ -z "$IMG" ]; then
            echo "ERROR: no kernel Image in $DIST_DIR"; exit 1
          fi

          git clone -q --depth=1 -b "$ANYKERNEL_BRANCH" "$ANYKERNEL_URL" "$AK"
          cp -f "$IMG" "$AK/$(basename "$IMG")"
          cp -f "$IMG" "$OUTPUT_DIR/$(basename "$IMG")"

          for f in dtbo.img dtb.img; do
            p=$(find "$DIST_DIR" -maxdepth 3 -name "$f" -type f -print -quit)
            if [ -n "$p" ]; then
              cp -f "$p" "$AK/$f"; cp -f "$p" "$OUTPUT_DIR/$f"
            fi
          done
          if [ ! -f "$AK/dtb.img" ]; then
            find "$DIST_DIR" -name '*.dtb' ! -name '*dtbo*' ! -name '*overlay*' -type f | sort | xargs -r cat > "$RUNNER_TEMP/dtb.img"
            if [ -s "$RUNNER_TEMP/dtb.img" ]; then
              cp -f "$RUNNER_TEMP/dtb.img" "$AK/dtb.img"; cp -f "$RUNNER_TEMP/dtb.img" "$OUTPUT_DIR/dtb.img"
            else
              echo "::warning::no dtb found"
            fi
          fi
          [ -f "$AK/dtbo.img" ] || echo "::warning::no dtbo.img found in dist"

          mkdir -p "$AK/modules/system/lib/modules"
          find "$DIST_DIR" -name '*.ko' -type f -exec cp -f {} "$AK/modules/system/lib/modules/" \;
          echo "Modules packed: $(ls "$AK/modules/system/lib/modules" | wc -l)"

          cd "$AK"
          zip -r9 "$OUTPUT_DIR/$ZIP_NAME" . -x '.git/*' > /dev/null
          echo "RELEASE_DATE=$(date +'%B %-d, %Y %H:%M')" >> "$GITHUB_ENV"
          ls -lh "$OUTPUT_DIR"

      - name: Upload files to repository releases page
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ github.workspace }}/compiled/*
          name: ${{ github.event.inputs.KERNEL_NAME }} // ${{ env.RELEASE_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            [Kernel Source](${{ env.KERNEL_SOURCE_URL }}/tree/${{ github.event.inputs.KERNEL_BRANCH }})
            [Latest Commit](${{ env.KERNEL_SOURCE_URL }}/commit/${{ env.COMMIT_ID }}) at the time of building.
