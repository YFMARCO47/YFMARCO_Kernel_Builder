name: Build Kernel GKI

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel source URL'
        required: true
        default: 'https://github.com/YFMARCO-Dev/android_kernel_samsung_sm6475.git'
      KERNEL_BRANCH:
        description: 'Kernel branch'
        required: true
        default: 'lineage-23.2'
      MODULES_SOURCE:
        description: ' modules source URL'
        required: true
        default: 'https://github.com/YFMARCO-Dev/android_kernel_samsung_sm6475-modules.git'
      MODULES_BRANCH:
        description: ' modules branch'
        required: true
        default: 'lineage-23.2'
      MODULES_BUILD_PATHS:
        description: 'Space-separated external-module paths relative to MODULES_SOURCE, or auto to discover Kbuild roots'
        required: false
        default: 'auto'
      DEVICETREES_SOURCE:
        description: 'devicetrees source URL'
        required: true
        default: 'https://github.com/YFMARCO-Dev/android_kernel_samsung_sm6475-devicetrees.git'
      DEVICETREES_BRANCH:
        description: 'devicetrees branch'
        required: true
        default: 'lineage-23.2'
      DTB_TYPES:
        description: 'Optional DTB install prefix (for example parrot-overlays-); leave empty to use dtb-y'
        required: false
        default: ''
      KERNEL_NAME:
        description: 'Kernel/zip name'
        required: true
        default: 'Spider-Kernel'
      DEVICE_CODENAME:
        description: 'Device codename'
        required: true
        default: 'a36xq'
      CONFIG_FILE:
        description: 'Defconfig followed by optional config fragments, separated by spaces'
        required: true
        default: 'gki_defconfig vendor/parrot_perf.config oem/parrot_sec.config lego.config'
      TOOLCHAIN_URL:
        description: "Clone URL of your toolchain"
        required: true
        default: 'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-15.0.0_r1/clang-r522817.tar.gz'
      ANYKERNEL:
        description: "Clone URL of your AnyKernel"
        required: true
        default: 'https://github.com/YFMARCO-Dev/AnyKernel3.git -b master'

jobs:
  Build:
    name: ${{ github.event.inputs.KERNEL_NAME }} by ${{ github.actor }}
    runs-on: ubuntu-22.04
    permissions: write-all
    defaults:
      run:
       shell: bash
       working-directory: ${{ github.workspace }}

    steps:
      - name: Set-up environment
        run: |
          rm -rf ${{ github.workspace }}/*
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev
          sudo apt-get install -y curl git ftp lftp wget libarchive-tools ccache python-is-python3
          sudo apt-get install -y zip unzip tar gzip bzip2 rar unrar cpio jq

      - name: Cloning Kernel Source
        run: |
          git clone --single-branch --depth=1 --no-tags https://$(printf %s "${{ secrets.KERNEL_USERNAME }}" | python -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.stdin.read().strip(), safe=""))'):$(printf %s "${{ secrets.KERNEL_TOKEN }}" | python -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.stdin.read().strip(), safe=""))')@$(echo "${{ github.event.inputs.KERNEL_SOURCE }}" | sed 's~https://~~') -b "${{ github.event.inputs.KERNEL_BRANCH }}" "${{ github.workspace }}/kernel"
          git clone --single-branch --depth=1 --no-tags https://$(printf %s "${{ secrets.KERNEL_USERNAME }}" | python -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.stdin.read().strip(), safe=""))'):$(printf %s "${{ secrets.KERNEL_TOKEN }}" | python -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.stdin.read().strip(), safe=""))')@$(echo "${{ github.event.inputs.MODULES_SOURCE }}" | sed 's~https://~~') -b "${{ github.event.inputs.MODULES_BRANCH }}" "${{ github.workspace }}/modules"
          git clone --single-branch --depth=1 --no-tags https://$(printf %s "${{ secrets.KERNEL_USERNAME }}" | python -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.stdin.read().strip(), safe=""))'):$(printf %s "${{ secrets.KERNEL_TOKEN }}" | python -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.stdin.read().strip(), safe=""))')@$(echo "${{ github.event.inputs.DEVICETREES_SOURCE }}" | sed 's~https://~~') -b "${{ github.event.inputs.DEVICETREES_BRANCH }}" "${{ github.workspace }}/devicetrees"
          cd ${{ github.workspace }}/kernel
          git submodule update --init --recursive

      - name: Link device trees and external modules
        run: |
          set -euo pipefail

          mapfile -t module_link_names < <(
            sed -nE 's|^[[:space:]]*ext-mod-dir[[:space:]]*:=[[:space:]]*\.\./([^/[:space:]]+-modules)[[:space:]]*$|\1|p' "${{ github.workspace }}/kernel/Makefile" | sort -u
          )
          for module_link_name in "${module_link_names[@]}"; do
            module_link="${{ github.workspace }}/${module_link_name}"
            if [[ -e "${module_link}" && ! -L "${module_link}" ]]; then
              echo "ERROR: ${module_link} already exists and is not a symbolic link"
              exit 1
            fi
            ln -sfn "${{ github.workspace }}/modules" "${module_link}"
          done

          vendor_dts="${{ github.workspace }}/kernel/arch/arm64/boot/dts/vendor"
          if [[ -e "${vendor_dts}" && ! -L "${vendor_dts}" ]]; then
            echo "ERROR: ${vendor_dts} already exists and is not a symbolic link"
            exit 1
          fi
          ln -sfn "${{ github.workspace }}/devicetrees" "${vendor_dts}"

      - name: Set-up Toolchain
        run: |
         mkdir -p ${{ github.workspace }}/toolchain
         if [[ "${{ github.event.inputs.TOOLCHAIN_URL }}" == *.tar.gz ]]; then
             wget -O clang-toolchain.tar.gz "${{ github.event.inputs.TOOLCHAIN_URL }}"
             tar -xzf clang-toolchain.tar.gz -C ${{ github.workspace }}/toolchain
             rm -f clang-toolchain.tar.gz
         else
             git clone --single-branch --depth=1 --no-tags ${{ github.event.inputs.TOOLCHAIN_URL }} ${{ github.workspace }}/toolchain
         fi

      - name: Set environment variables
        run: |
          echo "OBJDIR=${{ github.workspace }}/kernel/out" >> $GITHUB_ENV
          echo "ANYKERNEL=${{ github.workspace }}/anykernel" >> $GITHUB_ENV
          echo "CLANG_DIR=${{ github.workspace }}/toolchain" >> $GITHUB_ENV
          echo "KERNEL_NAME=${{ github.event.inputs.KERNEL_NAME }}" >> $GITHUB_ENV
          echo "ZIP_NAME=${{ github.event.inputs.KERNEL_NAME }}_${{ github.event.inputs.DEVICE_CODENAME }}_$(date +"%d%m%Y").zip" >> $GITHUB_ENV
          echo "OUTPUT_DIR=${{ github.workspace }}/compiled" >> $GITHUB_ENV
          echo "DTB_STAGING=${{ github.workspace }}/dtb_staging" >> $GITHUB_ENV
          cd ${{ github.workspace }}/kernel && echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

          KERNEL_SOURCE_URL="${{ github.event.inputs.KERNEL_SOURCE }}"
          if [[ "${KERNEL_SOURCE_URL}" == *.git ]]; then
            KERNEL_SOURCE_URL="${KERNEL_SOURCE_URL%.git}"
          fi
          echo "KERNEL_SOURCE_URL=${KERNEL_SOURCE_URL}" >> $GITHUB_ENV

      - name: Start Compilation
        run: |
         set -euo pipefail
         mkdir -p ${{ env.OUTPUT_DIR }}
         cd ${{ github.workspace }}/kernel

         export PATH="${{ env.CLANG_DIR }}/bin:$PATH"

         rmnet_mem_header="$(find "${{ github.workspace }}/modules" -type f -path '*/datarmnet-ext/mem/rmnet_mem.h' -print -quit)"
         if [[ -z "${rmnet_mem_header}" ]]; then
           echo "ERROR: datarmnet RMNET memory header was not found"
           exit 1
         fi
         if [[ ! -f "${{ github.workspace }}/kernel/include/linux/dmapool.h" ]]; then
           echo "ERROR: kernel DMA pool header was not found"
           exit 1
         fi
         module_header_cflags="-I$(dirname "${rmnet_mem_header}")"
         common_kcflags="-Wno-frame-larger-than -Wno-error=implicit-int -Wno-error=incompatible-function-pointer-types"

         make_defconfig() {
            start=$(date +"%s")
            read -r -a configs <<< "${{ github.event.inputs.CONFIG_FILE }}"
            if [[ ${#configs[@]} -eq 0 ]]; then
              echo "ERROR: CONFIG_FILE cannot be empty"
              exit 1
            fi

            make -s ARCH=arm64 O=${{ env.OBJDIR }} "${configs[0]}"
            if [[ ${#configs[@]} -gt 1 ]]; then
              fragments=()
              for config in "${configs[@]:1}"; do
                fragment="arch/arm64/configs/${config}"
                if [[ ! -f "${fragment}" ]]; then
                  echo "ERROR: Config fragment not found: ${fragment}"
                  exit 1
                fi
                fragments+=("${fragment}")
              done
              scripts/kconfig/merge_config.sh -m -O "${{ env.OBJDIR }}" \
                "${{ env.OBJDIR }}/.config" "${fragments[@]}"
              make -s ARCH=arm64 O=${{ env.OBJDIR }} olddefconfig
            fi
         }

         compile() {
            make -j$(nproc --all) \
            O=${{ env.OBJDIR }} \
            ARCH=arm64 \
            CC=clang \
            KCFLAGS="${common_kcflags}" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            AR=llvm-ar \
            LLVM_NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            LD=ld.lld \
            NM=llvm-nm \
            LLVM=1 \
            LLVM_IAS=1 \
            KBUILD_DTC_INCLUDE="${{ github.workspace }}/devicetrees" \
            Image modules dtbs
         }

         build_external_module() {
            local module_path="$1"
            shift
            local module_dir="${{ github.workspace }}/modules/${module_path}"

            if [[ ! -f "${module_dir}/Kbuild" ]]; then
              echo "ERROR: External module has no Kbuild file: ${module_dir}"
              exit 1
            fi

            echo "Building external module: ${module_path}"
            make -j$(nproc --all) \
              O=${{ env.OBJDIR }} \
              ARCH=arm64 \
              CC=clang \
              KCFLAGS="${common_kcflags} ${module_header_cflags}" \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
              AR=llvm-ar \
              LLVM_NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              LD=ld.lld \
              NM=llvm-nm \
              LLVM=1 \
              LLVM_IAS=1 \
              M="${module_dir}" modules "$@"
         }

         make_defconfig
         compile

         modules_root="${{ env.OBJDIR }}"

         echo
         echo "============================================================"
         echo "Building CONFIG-selected external modules"
         echo "============================================================"

         make -j$(nproc --all) \
           O=${{ env.OBJDIR }} \
           ARCH=arm64 \
           CC=clang \
           KCFLAGS="${common_kcflags} ${module_header_cflags}" \
           CROSS_COMPILE=aarch64-linux-gnu- \
           CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
           CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
           AR=llvm-ar \
           LLVM_NM=llvm-nm \
           OBJCOPY=llvm-objcopy \
           LD=ld.lld \
           NM=llvm-nm \
           LLVM=1 \
           LLVM_IAS=1 \
           KBUILD_DTC_INCLUDE="${{ github.workspace }}/devicetrees" \
           modules

         if ! find "${modules_root}" -type f -name '*.ko' -print -quit | grep -q .; then
           echo "ERROR: Kernel config requested external modules, but no .ko files were produced."
           exit 1
         fi

         echo
         echo "CONFIG-selected external modules:"
         find "${modules_root}" -type f -name '*.ko' -print | sort

         echo
         echo "============================================================"
         echo "Installing Device Trees"
         echo "============================================================"

         rm -rf "${{ env.DTB_STAGING }}"
         mkdir -p "${{ env.DTB_STAGING }}"

         dtb_type_args=()
         if [[ -n "${{ github.event.inputs.DTB_TYPES }}" ]]; then
           dtb_type_args=("DTB_TYPES=${{ github.event.inputs.DTB_TYPES }}")
         fi

         make -j$(nproc --all) \
           O=${{ env.OBJDIR }} \
           ARCH=arm64 \
           CC=clang \
           CROSS_COMPILE=aarch64-linux-gnu- \
           CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
           CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
           LLVM=1 \
           LLVM_IAS=1 \
           KBUILD_DTC_INCLUDE="${{ github.workspace }}/devicetrees" \
           INSTALL_DTBS_PATH="${{ env.DTB_STAGING }}" \
           "${dtb_type_args[@]}" \
           dtbs_install || true

         if ! find "${{ env.DTB_STAGING }}" -type f \( -name '*.dtb' -o -name '*.dtbo' \) -print -quit 2>/dev/null | grep -q .; then
           echo "dtbs_install did not produce DTB/DTBO files."
           echo "Searching kernel output tree for generated DTBs..."

           mapfile -t built_dtbs < <(
             find "${{ env.OBJDIR }}/arch/arm64/boot" \
               -type f \
               \( -name '*.dtb' -o -name '*.dtbo' \) \
               -print | sort
           )

           if [[ ${#built_dtbs[@]} -eq 0 ]]; then
             echo "ERROR: No generated DTB/DTBO files were found in ${modules_root}"
             exit 1
           fi

           for dtb_file in "${built_dtbs[@]}"; do
             relative_path="${dtb_file#${{ env.OBJDIR }}/arch/arm64/boot/}"
             mkdir -p "${{ env.DTB_STAGING }}/$(dirname "${relative_path}")"
             cp -f "${dtb_file}" "${{ env.DTB_STAGING }}/${relative_path}"
           done
         fi

         if ! find "${{ env.DTB_STAGING }}" -type f \( -name '*.dtb' -o -name '*.dtbo' \) -print -quit 2>/dev/null | grep -q .; then
           echo "ERROR: No DTB/DTBO files were installed"
           exit 1
         fi

         echo
         echo "Generated DTB/DTBO files:"
         find "${{ env.DTB_STAGING }}" -type f \( -name '*.dtb' -o -name '*.dtbo' \) -print | sort

         # ============================================================
         # ADDED: Build dtb.img / dtbo.img
         # ============================================================

         echo
         echo "============================================================"
         echo "Creating DTB/DTBO Images"
         echo "============================================================"

         DT_IMAGE_TOOLS="${{ github.workspace }}/dt_image_tools"
         mkdir -p "${DT_IMAGE_TOOLS}"

         MKDTBOIMG="${DT_IMAGE_TOOLS}/mkdtboimg.py"

         # Download official AOSP mkdtboimg.py.
         if [[ ! -f "${MKDTBOIMG}" ]]; then
           echo "Downloading AOSP mkdtboimg.py..."

           wget -q -O "${MKDTBOIMG}.b64" \
             "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/main/utils/src/mkdtboimg.py?format=TEXT"

           if [[ ! -s "${MKDTBOIMG}.b64" ]]; then
             echo "ERROR: Failed to download mkdtboimg.py"
             exit 1
           fi

           base64 -d "${MKDTBOIMG}.b64" > "${MKDTBOIMG}"
           rm -f "${MKDTBOIMG}.b64"
           chmod +x "${MKDTBOIMG}"
         fi

         # ------------------------------------------------------------
         # DTB files
         # ------------------------------------------------------------

         mapfile -t DTB_FILES < <(
           find "${{ env.DTB_STAGING }}" \
             -type f \
             -name '*.dtb' \
             -print | sort
         )

         if [[ ${#DTB_FILES[@]} -gt 0 ]]; then
           echo
           echo "DTB files:"
           printf '  %s\n' "${DTB_FILES[@]}"

           DTB_IMAGE="${{ env.OBJDIR }}/arch/arm64/boot/dtb.img"

           rm -f "${DTB_IMAGE}"

           echo
           echo "Creating dtb.img..."

           python3 "${MKDTBOIMG}" create \
             "${DTB_IMAGE}" \
             --page_size=2048 \
             "${DTB_FILES[@]}"

           if [[ ! -f "${DTB_IMAGE}" || ! -s "${DTB_IMAGE}" ]]; then
             echo "ERROR: dtb.img was not created"
             exit 1
           fi

           cp -f \
             "${DTB_IMAGE}" \
             "${{ env.DTB_STAGING }}/dtb.img"

           echo "dtb.img created successfully:"
           ls -lh "${DTB_IMAGE}"
         else
           echo "ERROR: No DTB files found. Cannot create dtb.img."
           exit 1
         fi

         # ------------------------------------------------------------
         # DTBO files
         # ------------------------------------------------------------

         mapfile -t DTBO_FILES < <(
           find "${{ env.DTB_STAGING }}" \
             -type f \
             -name '*.dtbo' \
             -print | sort
         )

         if [[ ${#DTBO_FILES[@]} -gt 0 ]]; then
           echo
           echo "DTBO files:"
           printf '  %s\n' "${DTBO_FILES[@]}"

           DTBO_IMAGE="${{ env.OBJDIR }}/arch/arm64/boot/dtbo.img"

           rm -f "${DTBO_IMAGE}"

           echo
           echo "Creating dtbo.img..."

           python3 "${MKDTBOIMG}" create \
             "${DTBO_IMAGE}" \
             --page_size=2048 \
             "${DTBO_FILES[@]}"

           if [[ ! -f "${DTBO_IMAGE}" || ! -s "${DTBO_IMAGE}" ]]; then
             echo "ERROR: dtbo.img was not created"
             exit 1
           fi

           cp -f \
             "${DTBO_IMAGE}" \
             "${{ env.DTB_STAGING }}/dtbo.img"

           echo "dtbo.img created successfully:"
           ls -lh "${DTBO_IMAGE}"
         else
           echo "ERROR: No DTBO files found. Cannot create dtbo.img."
           exit 1
         fi

         echo
         echo "============================================================"
         echo "DTB/DTBO Images Ready"
         echo "============================================================"

         echo "DTB image:"
         ls -lh "${{ env.OBJDIR }}/arch/arm64/boot/dtb.img"

         echo "DTBO image:"
         ls -lh "${{ env.OBJDIR }}/arch/arm64/boot/dtbo.img"

         (
           cd "${{ env.DTB_STAGING }}"
           zip -qr "${{ env.OUTPUT_DIR }}/dtbs-${{ env.DEVICE_CODENAME }}.zip" .
         )

         if find "${modules_root}" -type f -name '*.ko' -print -quit | grep -q .; then
           (
             cd "${modules_root}"
             find . -type f -name '*.ko' -print | zip -q "${{ env.OUTPUT_DIR }}/modules-${{ env.DEVICE_CODENAME }}.zip" -@
           )
         else
           echo "ERROR: No external kernel modules were built"
           exit 1
         fi

         end=$(date +"%s")
         diff=$((end - start))
         echo -e "BUILD COMPLETED IN ${diff} SECONDS"

        continue-on-error: false

      - name: Checking for outputs
        run: |
         cd "${{ env.OBJDIR }}"

         compiled_image="arch/arm64/boot/Image"
         compiled_gz_image="arch/arm64/boot/Image.gz"
         compiled_gz_dtb="arch/arm64/boot/Image.gz-dtb"
         compiled_dtbo="arch/arm64/boot/dtbo.img"
         compiled_dtb_img="arch/arm64/boot/dtb.img"
         compiled_dtb="arch/arm64/boot/dtb"

         kernel_image=""

         if [[ -f "${compiled_image}" ]]; then
             kernel_image="${compiled_image}"
         elif [[ -f "${compiled_gz_image}" ]]; then
             kernel_image="${compiled_gz_image}"
         elif [[ -f "${compiled_gz_dtb}" ]]; then
             kernel_image="${compiled_gz_dtb}"
         fi

         if [[ -z "${kernel_image}" ]]; then
             kernel_image="$(find "${{ env.OBJDIR }}" -type f \
                 \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.lz4' \
                 -o -name 'Image.gz-dtb' -o -name 'Image.lz4-dtb' -o -name 'Image-dtb' \) \
                 -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2-)"
         fi

         if [[ -n "${kernel_image}" ]]; then
              git clone -q ${{ github.event.inputs.ANYKERNEL }} "${{ env.ANYKERNEL }}"

              kernel_name=$(basename "${kernel_image}")

              cp -f "${kernel_image}" "${{ env.ANYKERNEL }}/${kernel_name}" || true
              cp -f "${kernel_image}" "${{ env.OUTPUT_DIR }}/${kernel_name}" || true

              if [[ -f "${compiled_dtbo}" ]]; then
                  cp -f "${compiled_dtbo}" "${{ env.ANYKERNEL }}/dtbo.img" || true
                  cp -f "${compiled_dtbo}" "${{ env.OUTPUT_DIR }}/dtbo.img" || true
              fi

              if [[ -f "${compiled_dtb_img}" ]]; then
                  cp -f "${compiled_dtb_img}" "${{ env.ANYKERNEL }}/dtb.img" || true
                  cp -f "${compiled_dtb_img}" "${{ env.OUTPUT_DIR }}/dtb.img" || true
              elif [[ -f "${compiled_dtb}" ]]; then
                  cp -f "${compiled_dtb}" "${{ env.ANYKERNEL }}/dtb" || true
                  cp -f "${compiled_dtb}" "${{ env.OUTPUT_DIR }}/dtb" || true
              fi

              cd "${{ env.ANYKERNEL }}"
              zip -r AnyKernel.zip *
              mv -- "AnyKernel.zip" "${{ env.ZIP_NAME }}"
              mv -- "${{ env.ANYKERNEL }}/${{ env.ZIP_NAME }}" "${{ env.OUTPUT_DIR }}/${{ env.ZIP_NAME }}"
              rm -rf "${{ env.ANYKERNEL }}"
         else
              echo "ERROR: Some output is missing!"
              echo "Available files in arch/arm64/boot:"
              find "${{ env.OBJDIR }}/arch/arm64/boot" -maxdepth 2 -type f -print | sort
              exit 1
         fi

         zip_file=$(find ${{ env.OUTPUT_DIR }} -name '${{ github.event.inputs.KERNEL_NAME }}*.zip' -print -quit)
         echo "ZIP_NAME=$(basename "$zip_file" .zip)" >> $GITHUB_ENV
         echo "RELEASE_DATE=$(date +'%B %-d, %Y %H:%M')" >> $GITHUB_ENV

      - name: Upload files to repository releases page
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ github.workspace }}/compiled/*
          name: ${{ github.event.inputs.KERNEL_NAME }} // ${{ env.RELEASE_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            [Kernel Source](${{ env.KERNEL_SOURCE_URL }}/tree/${{ github.event.inputs.KERNEL_BRANCH }})
            [Latest Commit](${{ env.KERNEL_SOURCE_URL }}/commit/${{ env.COMMIT_ID }}) at the time of building.
